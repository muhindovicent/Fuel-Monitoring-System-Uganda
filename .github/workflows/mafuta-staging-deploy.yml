name: MafutaWatch staging deployment

on:
  push:
    branches: [ui/map-first-command-center]
    paths:
      - .github/workflows/mafuta-staging-deploy.yml
      - .github/workflows/ci.yml
      - deploy/*.mjs
      - server/**
      - app/**
      - package.json
      - package-lock.json
      - Dockerfile
      - .dockerignore
      - test/hosting*.test.js

permissions:
  contents: read
  actions: read

concurrency:
  group: mafutawatch-render-staging
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check deployment secret presence
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          NEON_DIRECT_DATABASE_URL: ${{ secrets.NEON_DIRECT_DATABASE_URL }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          for name in RENDER_API_KEY NEON_DIRECT_DATABASE_URL BOOTSTRAP_ADMIN_EMAIL BOOTSTRAP_ADMIN_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::A required staging deployment secret is missing: $name"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies without deployment secrets
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify deployment code without deployment secrets
        run: npm run lint && npm test
      - name: Require complete application and Docker verification for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verification=""
          for attempt in $(seq 1 12); do
            verification="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event push --commit "$GITHUB_SHA" --json databaseId --jq '.[0].databaseId // empty')"
            if [[ -n "$verification" ]]; then break; fi
            sleep 5
          done
          if [[ -z "$verification" ]]; then echo '::error::Application verification run was not found.'; exit 1; fi
          gh run watch "$verification" --repo "$GITHUB_REPOSITORY" --interval 15 --exit-status
      - name: Deploy isolated database and matching Render application
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          NEON_DIRECT_DATABASE_URL: ${{ secrets.NEON_DIRECT_DATABASE_URL }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
        run: node deploy/staging-render.mjs upgrade
