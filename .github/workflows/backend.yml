name: Backend PostgreSQL integration
on:
  push:
    paths:
      - 'backend/**'
      - 'app/js/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'app/js/**'
      - '.github/workflows/backend.yml'
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mafuta_test
          POSTGRES_PASSWORD: local_ci_only_password
          POSTGRES_DB: mafuta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mafuta_test -d mafuta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://mafuta_test:local_ci_only_password@127.0.0.1:5432/mafuta_test
      JWT_SECRET: test-only-ci-secret-not-for-production-1234567890
      FRONTEND_ORIGINS: http://localhost:5500
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: node --check ../app/js/app.js && node --check ../app/js/production.js && node --check ../app/service-worker.js
